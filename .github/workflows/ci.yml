name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:
  small-linux:
    name: Small / Linux
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'

    env:
      CC: clang-23
      CXX: clang++-23
      CLANG_TIDY_BIN: clang-tidy-23
      CLANG_FORMAT_BIN: clang-format-23

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

          sudo apt-get update

          sudo apt-get install -y \
            clang-23 \
            clang-tidy-23 \
            clang-format-23 \
            libglm-dev \
            libgtest-dev

      - name: Check formatting
        run: |
          ./tools/formatter/format.sh
          git diff --exit-code

      - name: Run small tests
        run: ./tests/test_small.sh

      - name: Show test log
        if: failure()
        run: |
          if [ -f tests/result/test-small.log ]; then
            cat tests/result/test-small.log
          fi

  sanitizers-linux:
    name: ASan + UBSan / Linux
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch'

    env:
      CC: clang-23
      CXX: clang++-23

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

          sudo apt-get update

          sudo apt-get install -y \
            clang-23 \
            libclang-rt-23-dev \
            libglm-dev \
            libgtest-dev

      - name: Run sanitizers
        run: ./tests/test_sanitizers.sh

      - name: Show sanitizer log
        if: failure()
        run: |
          if [ -f tests/result/sanitizers.log ]; then
            cat tests/result/sanitizers.log
          fi

  medium-macos:
    name: Medium / MacOS
    runs-on: macos-26
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install \
            glm \
            glfw \
            vulkan-volk \
            googletest

      - name: Run medium tests
        run: ./tests/test_medium.sh

      - name: Show test log
        if: failure()
        run: |
          if [ -f tests/result/test-medium.log ]; then
            cat tests/result/test-medium.log
          fi

  heavy-macos:
    name: Heavy / MacOS
    runs-on: macos-26
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install \
            glm \
            glfw \
            vulkan-volk \
            googletest

      - name: Run heavy tests
        run: ./tests/test_heavy.sh

      - name: Show test log
        if: failure()
        run: |
          if [ -f tests/result/test-heavy.log ]; then
            cat tests/result/test-heavy.log
          fi
